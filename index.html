<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人脸坐标检测</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            color: white;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .camera-selector {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }

        select {
            padding: 10px 15px;
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(10px);
            font-size: 16px;
            width: 300px;
        }

        select option {
            background: rgba(0, 0, 0, 0.8);
            color: white;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        button:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #startBtn {
            background: rgba(76, 175, 80, 0.7);
        }

        #stopBtn {
            background: rgba(244, 67, 54, 0.7);
        }

        #connectBtn {
            background: rgba(33, 150, 243, 0.7);
        }

        .tracking-options {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .tracking-option {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.1);
            padding: 10px 15px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .tracking-option input {
            width: 18px;
            height: 18px;
        }

        .tracking-option label {
            font-size: 14px;
            cursor: pointer;
        }

        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            align-items: start;
        }

        .camera-container {
            position: relative;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        #video,
        #canvas {
            width: 100%;
            height: auto;
            display: block;
        }

        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        .output-container {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 25px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .output-container h3 {
            margin-bottom: 20px;
            font-size: 1.5rem;
            text-align: center;
        }

        .coordinates-output {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            padding: 20px;
            min-height: 200px;
            max-height: 400px;
            overflow-y: auto;
            margin-bottom: 20px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.4;
        }

        .coordinates-output p {
            margin-bottom: 8px;
        }

        .status {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            opacity: 0.8;
        }

        /* 移动端适配 */
        @media (max-width: 768px) {
            .content {
                grid-template-columns: 1fr;
            }

            header h1 {
                font-size: 2rem;
            }

            .controls {
                flex-direction: column;
                align-items: center;
            }

            .tracking-options {
                flex-direction: column;
                align-items: center;
            }

            button {
                width: 200px;
            }

            select {
                width: 90%;
            }
        }

        /* 滚动条样式 */
        .coordinates-output::-webkit-scrollbar {
            width: 6px;
        }

        .coordinates-output::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }

        .coordinates-output::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 3px;
        }

        .face-coordinates {
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
        }

        .face-coordinates p {
            margin-bottom: 5px;
        }

        hr {
            border: none;
            height: 1px;
            background: rgba(255, 255, 255, 0.2);
            margin: 10px 0;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>人脸坐标检测系统</h1>
            <div class="camera-selector">
                <select id="cameraSelect">
                    <option value="">选择摄像头...</option>
                </select>
            </div>
            <div class="tracking-options">
                <div class="tracking-option">
                    <input type="checkbox" id="trackBoundingBox" checked>
                    <label for="trackBoundingBox">追踪边界框</label>
                </div>
                <div class="tracking-option">
                    <input type="checkbox" id="trackPupils" checked>
                    <label for="trackPupils">追踪瞳孔位置</label>
                </div>
                <div class="tracking-option">
                    <input type="checkbox" id="trackAllLandmarks">
                    <label for="trackAllLandmarks">追踪所有特征点</label>
                </div>
            </div>
            <div class="controls">
                <button id="startBtn">开始检测</button>
                <button id="stopBtn" disabled>停止检测</button>
                <button id="connectBtn">连接ESP32</button>
            </div>
        </header>

        <div class="content">
            <div class="camera-container">
                <video id="video" playsinline></video>
                <canvas id="canvas"></canvas>
            </div>

            <div class="output-container">
                <h3>人脸坐标输出</h3>
                <div id="coordinatesOutput" class="coordinates-output">
                    <p>等待检测...</p>
                </div>
                <div class="status">
                    <span id="statusText">状态: 未开始</span>
                    <span id="connectionStatus">ESP32: 未连接</span>
                </div>
            </div>
        </div>
    </div>

    <!-- MediaPipe CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/face_detection.js"></script>

    <script>
        class FaceDetectionApp {
            constructor() {
                this.faceDetection = null;
                this.camera = null;
                this.isRunning = false;
                this.wsConnection = null;
                this.isConnected = false;
                this.cameras = [];
                this.selectedCameraId = null;

                // 追踪选项
                this.trackBoundingBox = true;
                this.trackPupils = true;
                this.trackAllLandmarks = false;

                this.videoElement = document.getElementById('video');
                this.canvasElement = document.getElementById('canvas');
                this.canvasCtx = this.canvasElement.getContext('2d');
                this.startBtn = document.getElementById('startBtn');
                this.stopBtn = document.getElementById('stopBtn');
                this.connectBtn = document.getElementById('connectBtn');
                this.cameraSelect = document.getElementById('cameraSelect');
                this.coordinatesOutput = document.getElementById('coordinatesOutput');
                this.statusText = document.getElementById('statusText');
                this.connectionStatus = document.getElementById('connectionStatus');

                // 追踪选项元素
                this.trackBoundingBoxCheckbox = document.getElementById('trackBoundingBox');
                this.trackPupilsCheckbox = document.getElementById('trackPupils');
                this.trackAllLandmarksCheckbox = document.getElementById('trackAllLandmarks');

                this.initializeEventListeners();
                this.initializeFaceDetection();
                this.loadCameras();
            }

            initializeEventListeners() {
                this.startBtn.addEventListener('click', () => this.startDetection());
                this.stopBtn.addEventListener('click', () => this.stopDetection());
                this.connectBtn.addEventListener('click', () => this.connectToESP32());
                this.cameraSelect.addEventListener('change', (e) => {
                    this.selectedCameraId = e.target.value;
                    if (this.isRunning) {
                        this.restartDetection();
                    }
                });

                // 追踪选项事件监听
                this.trackBoundingBoxCheckbox.addEventListener('change', (e) => {
                    this.trackBoundingBox = e.target.checked;
                    this.updateDetectionMode();
                });

                this.trackPupilsCheckbox.addEventListener('change', (e) => {
                    this.trackPupils = e.target.checked;
                    this.updateDetectionMode();
                });

                this.trackAllLandmarksCheckbox.addEventListener('change', (e) => {
                    this.trackAllLandmarks = e.target.checked;
                    this.updateDetectionMode();

                    // 如果选择追踪所有特征点，自动取消追踪瞳孔（避免重复）
                    if (this.trackAllLandmarks && this.trackPupils) {
                        this.trackPupils = false;
                        this.trackPupilsCheckbox.checked = false;
                    }
                });
            }

            updateDetectionMode() {
                // 根据选择的追踪模式调整检测参数
                if (this.faceDetection) {
                    // 如果只追踪边界框，可以降低检测精度以优化性能
                    if (this.trackBoundingBox && !this.trackPupils && !this.trackAllLandmarks) {
                        this.faceDetection.setOptions({
                            model: 'short',
                            minDetectionConfidence: 0.3  // 降低置信度阈值以提高性能
                        });
                    } else {
                        // 需要更多特征点时使用默认设置
                        this.faceDetection.setOptions({
                            model: 'short',
                            minDetectionConfidence: 0.5
                        });
                    }
                }

                // 如果正在运行，重新绘制当前结果
                if (this.isRunning && this.lastResults) {
                    this.onFaceDetectionResults(this.lastResults);
                }
            }

            async loadCameras() {
                try {
                    // 获取摄像头列表
                    const devices = await navigator.mediaDevices.enumerateDevices();
                    this.cameras = devices.filter(device => device.kind === 'videoinput');

                    // 清空选择框
                    this.cameraSelect.innerHTML = '<option value="">选择摄像头...</option>';

                    // 添加摄像头选项
                    this.cameras.forEach((camera, index) => {
                        const option = document.createElement('option');
                        option.value = camera.deviceId;
                        option.text = camera.label || `摄像头 ${index + 1}`;
                        this.cameraSelect.appendChild(option);
                    });

                    // 默认选择第一个摄像头
                    if (this.cameras.length > 0) {
                        this.selectedCameraId = this.cameras[0].deviceId;
                        this.cameraSelect.value = this.selectedCameraId;
                    }

                } catch (error) {
                    console.error('获取摄像头列表失败:', error);
                }
            }

            async initializeFaceDetection() {
                this.faceDetection = new FaceDetection({
                    locateFile: (file) => {
                        return `https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/${file}`;
                    }
                });

                this.faceDetection.setOptions({
                    model: 'short',
                    minDetectionConfidence: 0.5
                });

                this.faceDetection.onResults((results) => this.onFaceDetectionResults(results));

                this.statusText.textContent = '状态: 就绪';
            }

            async startDetection() {
                if (this.isRunning) return;

                try {
                    // 设置canvas尺寸与视频匹配
                    this.canvasElement.width = this.videoElement.videoWidth || 640;
                    this.canvasElement.height = this.videoElement.videoHeight || 480;

                    // 获取摄像头约束条件
                    const constraints = {
                        video: {
                            width: { ideal: 640 },
                            height: { ideal: 480 }
                        }
                    };

                    // 如果选择了特定摄像头，添加到约束条件
                    if (this.selectedCameraId) {
                        constraints.video.deviceId = { exact: this.selectedCameraId };
                    }

                    // 获取视频流
                    const stream = await navigator.mediaDevices.getUserMedia(constraints);
                    this.videoElement.srcObject = stream;

                    // 等待视频加载
                    await new Promise((resolve) => {
                        this.videoElement.onloadedmetadata = () => {
                            resolve();
                        };
                    });

                    this.videoElement.play();

                    // 设置摄像头
                    this.camera = new Camera(this.videoElement, {
                        onFrame: async () => {
                            if (this.faceDetection) {
                                await this.faceDetection.send({ image: this.videoElement });
                            }
                        },
                        width: this.videoElement.videoWidth,
                        height: this.videoElement.videoHeight
                    });

                    await this.camera.start();
                    this.isRunning = true;

                    this.startBtn.disabled = true;
                    this.stopBtn.disabled = false;
                    this.statusText.textContent = '状态: 检测中...';

                } catch (error) {
                    console.error('启动摄像头失败:', error);
                    this.statusText.textContent = '状态: 启动失败';
                    alert('无法访问摄像头，请确保已授予摄像头权限');
                }
            }

            async restartDetection() {
                if (this.isRunning) {
                    this.stopDetection();
                    // 稍等片刻再重新启动
                    setTimeout(() => {
                        this.startDetection();
                    }, 500);
                }
            }

            stopDetection() {
                if (this.camera) {
                    this.camera.stop();
                    this.camera = null;
                }

                // 停止视频流
                if (this.videoElement.srcObject) {
                    this.videoElement.srcObject.getTracks().forEach(track => track.stop());
                    this.videoElement.srcObject = null;
                }

                this.isRunning = false;
                this.startBtn.disabled = false;
                this.stopBtn.disabled = true;
                this.statusText.textContent = '状态: 已停止';

                // 清空画布
                this.canvasCtx.clearRect(0, 0, this.canvasElement.width, this.canvasElement.height);
                this.coordinatesOutput.innerHTML = '<p>检测已停止</p>';
            }

            onFaceDetectionResults(results) {
                // 保存结果用于重新绘制
                this.lastResults = results;

                this.canvasCtx.save();
                this.canvasCtx.clearRect(0, 0, this.canvasElement.width, this.canvasElement.height);

                // 绘制摄像头画面
                this.canvasCtx.drawImage(
                    results.image,
                    0, 0,
                    this.canvasElement.width,
                    this.canvasElement.height
                );

                let outputHTML = '';

                if (results.detections && results.detections.length > 0) {
                    results.detections.forEach((detection, index) => {
                        const landmarks = detection.landmarks;

                        // 绘制人脸边界框 - 使用自定义绘制方法避免遮挡
                        if (this.trackBoundingBox && detection.boundingBox) {
                            this.drawCustomBoundingBox(detection.boundingBox);
                        }

                        // 绘制特征点
                        if (this.trackAllLandmarks && landmarks) {
                            drawLandmarks(
                                this.canvasCtx,
                                landmarks,
                                { color: '#FF0000', lineWidth: 1, radius: 2 }
                            );
                        }

                        // 提取关键坐标
                        const coordinates = this.extractKeyCoordinates(landmarks, detection.boundingBox);

                        outputHTML += `
                            <div class="face-coordinates">
                                <p><strong>人脸 ${index + 1}:</strong></p>`;

                        if (this.trackBoundingBox) {
                            outputHTML += `
                                <p>边界框: (${coordinates.bbox.x.toFixed(2)}, ${coordinates.bbox.y.toFixed(2)})</p>
                                <p>尺寸: ${coordinates.bbox.width.toFixed(2)} × ${coordinates.bbox.height.toFixed(2)}</p>`;
                        }

                        if (this.trackPupils || this.trackAllLandmarks) {
                            outputHTML += `
                                <p>右眼: (${coordinates.rightEye.x.toFixed(2)}, ${coordinates.rightEye.y.toFixed(2)})</p>
                                <p>左眼: (${coordinates.leftEye.x.toFixed(2)}, ${coordinates.leftEye.y.toFixed(2)})</p>`;

                            // 计算瞳孔相对位置（相对于眼睛区域）
                            if (this.trackPupils) {
                                const pupilOffset = this.calculatePupilOffset(coordinates);
                                outputHTML += `
                                <p>瞳孔相对位置: 水平 ${pupilOffset.horizontal.toFixed(2)}, 垂直 ${pupilOffset.vertical.toFixed(2)}</p>`;
                            }
                        }

                        if (this.trackAllLandmarks) {
                            outputHTML += `
                                <p>鼻子: (${coordinates.nose.x.toFixed(2)}, ${coordinates.nose.y.toFixed(2)})</p>
                                <p>嘴巴: (${coordinates.mouth.x.toFixed(2)}, ${coordinates.mouth.y.toFixed(2)})</p>
                                <p>右耳: (${coordinates.rightEar.x.toFixed(2)}, ${coordinates.rightEar.y.toFixed(2)})</p>
                                <p>左耳: (${coordinates.leftEar.x.toFixed(2)}, ${coordinates.leftEar.y.toFixed(2)})</p>`;
                        }

                        outputHTML += `
                            </div>
                            <hr>`;

                        // 发送坐标到ESP32
                        if (this.isConnected) {
                            this.sendCoordinatesToESP32(coordinates);
                        }
                    });
                } else {
                    outputHTML = '<p>未检测到人脸</p>';
                }

                this.coordinatesOutput.innerHTML = outputHTML;
                this.canvasCtx.restore();
            }

            // 计算瞳孔相对位置（相对于眼睛区域）
            calculatePupilOffset(coordinates) {
                // 假设眼睛区域为边界框的上半部分
                const eyeRegionWidth = coordinates.bbox.width;
                const eyeRegionHeight = coordinates.bbox.height / 2;
                const eyeRegionTop = coordinates.bbox.y - coordinates.bbox.height / 2;

                // 计算右眼相对位置
                const rightEyeX = coordinates.rightEye.x - (coordinates.bbox.x - coordinates.bbox.width / 2);
                const rightEyeY = coordinates.rightEye.y - eyeRegionTop;

                // 计算左眼相对位置
                const leftEyeX = coordinates.leftEye.x - (coordinates.bbox.x - coordinates.bbox.width / 2);
                const leftEyeY = coordinates.leftEye.y - eyeRegionTop;

                // 计算平均值
                const avgX = (rightEyeX + leftEyeX) / 2;
                const avgY = (rightEyeY + leftEyeY) / 2;

                // 转换为相对位置（0-1）
                const horizontal = avgX / eyeRegionWidth;
                const vertical = avgY / eyeRegionHeight;

                return {
                    horizontal: Math.max(0, Math.min(1, horizontal)),
                    vertical: Math.max(0, Math.min(1, vertical))
                };
            }

            // 自定义绘制边界框，避免遮挡人脸
            drawCustomBoundingBox(boundingBox) {
                const ctx = this.canvasCtx;
                const width = this.canvasElement.width;
                const height = this.canvasElement.height;

                // 计算边界框的实际像素坐标
                const x = boundingBox.xCenter * width - boundingBox.width * width / 2;
                const y = boundingBox.yCenter * height - boundingBox.height * height / 2;
                const w = boundingBox.width * width;
                const h = boundingBox.height * height;

                // 设置样式
                ctx.strokeStyle = '#00FF00';
                ctx.lineWidth = 3;
                ctx.setLineDash([5, 5]); // 虚线效果

                // 绘制边界框
                ctx.strokeRect(x, y, w, h);

                // 绘制四个角的标记
                ctx.setLineDash([]); // 取消虚线
                ctx.lineWidth = 2;

                // 左上角
                ctx.beginPath();
                ctx.moveTo(x, y);
                ctx.lineTo(x + 15, y);
                ctx.moveTo(x, y);
                ctx.lineTo(x, y + 15);
                ctx.stroke();

                // 右上角
                ctx.beginPath();
                ctx.moveTo(x + w, y);
                ctx.lineTo(x + w - 15, y);
                ctx.moveTo(x + w, y);
                ctx.lineTo(x + w, y + 15);
                ctx.stroke();

                // 左下角
                ctx.beginPath();
                ctx.moveTo(x, y + h);
                ctx.lineTo(x + 15, y + h);
                ctx.moveTo(x, y + h);
                ctx.lineTo(x, y + h - 15);
                ctx.stroke();

                // 右下角
                ctx.beginPath();
                ctx.moveTo(x + w, y + h);
                ctx.lineTo(x + w - 15, y + h);
                ctx.moveTo(x + w, y + h);
                ctx.lineTo(x + w, y + h - 15);
                ctx.stroke();
            }

            extractKeyCoordinates(landmarks, boundingBox) {
                // MediaPipe人脸特征点索引
                const FACE_LANDMARKS = {
                    RIGHT_EYE: 0,      // 右眼
                    LEFT_EYE: 1,       // 左眼
                    NOSE_TIP: 2,       // 鼻尖
                    MOUTH_CENTER: 3,   // 嘴巴中心
                    RIGHT_EAR: 4,      // 右耳
                    LEFT_EAR: 5        // 左耳
                };

                // 默认值，防止未检测到特征点时出错
                const defaultCoord = { x: 0, y: 0 };

                return {
                    bbox: {
                        x: boundingBox ? boundingBox.xCenter * this.canvasElement.width : 0,
                        y: boundingBox ? boundingBox.yCenter * this.canvasElement.height : 0,
                        width: boundingBox ? boundingBox.width * this.canvasElement.width : 0,
                        height: boundingBox ? boundingBox.height * this.canvasElement.height : 0
                    },
                    rightEye: {
                        x: landmarks && landmarks[FACE_LANDMARKS.RIGHT_EYE] ?
                            landmarks[FACE_LANDMARKS.RIGHT_EYE].x * this.canvasElement.width : 0,
                        y: landmarks && landmarks[FACE_LANDMARKS.RIGHT_EYE] ?
                            landmarks[FACE_LANDMARKS.RIGHT_EYE].y * this.canvasElement.height : 0
                    },
                    leftEye: {
                        x: landmarks && landmarks[FACE_LANDMARKS.LEFT_EYE] ?
                            landmarks[FACE_LANDMARKS.LEFT_EYE].x * this.canvasElement.width : 0,
                        y: landmarks && landmarks[FACE_LANDMARKS.LEFT_EYE] ?
                            landmarks[FACE_LANDMARKS.LEFT_EYE].y * this.canvasElement.height : 0
                    },
                    nose: {
                        x: landmarks && landmarks[FACE_LANDMARKS.NOSE_TIP] ?
                            landmarks[FACE_LANDMARKS.NOSE_TIP].x * this.canvasElement.width : 0,
                        y: landmarks && landmarks[FACE_LANDMARKS.NOSE_TIP] ?
                            landmarks[FACE_LANDMARKS.NOSE_TIP].y * this.canvasElement.height : 0
                    },
                    mouth: {
                        x: landmarks && landmarks[FACE_LANDMARKS.MOUTH_CENTER] ?
                            landmarks[FACE_LANDMARKS.MOUTH_CENTER].x * this.canvasElement.width : 0,
                        y: landmarks && landmarks[FACE_LANDMARKS.MOUTH_CENTER] ?
                            landmarks[FACE_LANDMARKS.MOUTH_CENTER].y * this.canvasElement.height : 0
                    },
                    rightEar: {
                        x: landmarks && landmarks[FACE_LANDMARKS.RIGHT_EAR] ?
                            landmarks[FACE_LANDMARKS.RIGHT_EAR].x * this.canvasElement.width : 0,
                        y: landmarks && landmarks[FACE_LANDMARKS.RIGHT_EAR] ?
                            landmarks[FACE_LANDMARKS.RIGHT_EAR].y * this.canvasElement.height : 0
                    },
                    leftEar: {
                        x: landmarks && landmarks[FACE_LANDMARKS.LEFT_EAR] ?
                            landmarks[FACE_LANDMARKS.LEFT_EAR].x * this.canvasElement.width : 0,
                        y: landmarks && landmarks[FACE_LANDMARKS.LEFT_EAR] ?
                            landmarks[FACE_LANDMARKS.LEFT_EAR].y * this.canvasElement.height : 0
                    }
                };
            }

            connectToESP32() {
                // 这里需要替换为你的ESP32的IP地址
                const esp32IP = prompt('请输入ESP32的IP地址:', '192.168.1.100');

                if (!esp32IP) return;

                try {
                    // 如果已有连接，先关闭
                    if (this.wsConnection) {
                        this.wsConnection.close();
                    }

                    this.wsConnection = new WebSocket(`ws://${esp32IP}:81`);

                    this.wsConnection.onopen = () => {
                        this.isConnected = true;
                        this.connectionStatus.textContent = 'ESP32: 已连接';
                        this.connectBtn.textContent = '断开连接';
                        this.connectBtn.style.background = 'rgba(76, 175, 80, 0.7)';
                        console.log('ESP32连接成功');
                    };

                    this.wsConnection.onclose = () => {
                        this.isConnected = false;
                        this.connectionStatus.textContent = 'ESP32: 未连接';
                        this.connectBtn.textContent = '连接ESP32';
                        this.connectBtn.style.background = 'rgba(33, 150, 243, 0.7)';
                        console.log('ESP32连接已关闭');
                    };

                    this.wsConnection.onerror = (error) => {
                        console.error('WebSocket连接错误:', error);
                        alert('连接ESP32失败，请检查IP地址和网络连接');
                    };

                } catch (error) {
                    console.error('创建WebSocket连接失败:', error);
                    alert('连接失败: ' + error.message);
                }
            }

            sendCoordinatesToESP32(coordinates) {
                if (this.wsConnection && this.wsConnection.readyState === WebSocket.OPEN) {
                    const data = {
                        type: 'face_coordinates',
                        timestamp: Date.now(),
                        coordinates: coordinates,
                        trackingOptions: {
                            boundingBox: this.trackBoundingBox,
                            pupils: this.trackPupils,
                            allLandmarks: this.trackAllLandmarks
                        }
                    };

                    this.wsConnection.send(JSON.stringify(data));
                }
            }
        }

        // 页面加载完成后初始化应用
        document.addEventListener('DOMContentLoaded', () => {
            new FaceDetectionApp();
        });
    </script>
</body>

</html>
