<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>人脸坐标检测（马卡龙主题 — 含暗色模式）</title>
    <style>
        /* ---------- 全局重置 ---------- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --glass-bg: rgba(255, 255, 255, 0.6);
            --text: #32424a;
            --muted: #7a8a92;
            --card: rgba(255, 255, 255, 0.8);
            --accent-1: #ffdce6;
            /* 轻粉 */
            --accent-2: #ddf7f3;
            /* 浅青 */
            --accent-3: #fff7d9;
            /* 浅黄 */
            --accent-4: #e9e7ff;
            /* 浅紫 */
            --glass-border: rgba(255, 255, 255, 0.55);
            --shadow: 0 10px 30px rgba(38, 50, 56, 0.08);
            --focus: rgba(61, 132, 255, 0.12);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --glass-bg: rgba(22, 26, 28, 0.55);
                --text: #e6eef2;
                --muted: #b7c2c7;
                --card: rgba(24, 28, 30, 0.6);
                --accent-1: #4b2b36;
                /* 深色版对应的色相区域 */
                --accent-2: #1f3f3b;
                --accent-3: #3b341f;
                --accent-4: #2f2a3f;
                --glass-border: rgba(255, 255, 255, 0.04);
                --shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
                --focus: rgba(61, 132, 255, 0.12);
            }

            body {
                background: linear-gradient(135deg, #0f1720 0%, #071018 100%);
            }
        }

        body {
            font-family: Inter, -apple-system, "Helvetica Neue", Arial;
            -webkit-font-smoothing: antialiased;
            background: linear-gradient(135deg, var(--accent-1) 0%, var(--accent-2) 50%, var(--accent-3) 100%);
            color: var(--text);
            min-height: 100vh;
            padding: 28px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            display: grid;
            gap: 14px;
            align-items: center;
            padding: 18px;
            border-radius: 16px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.66), rgba(255, 255, 255, 0.5));
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow);
            backdrop-filter: blur(8px) saturate(120%);
        }

        header .title {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        header h1 {
            font-size: 1.4rem;
            letter-spacing: 0.2px;
        }

        header p {
            color: var(--muted);
            font-size: 0.9rem;
        }

        .controls-row {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        .camera-selector select {
            padding: 10px 14px;
            border-radius: 12px;
            border: 1px solid rgba(0, 0, 0, 0.06);
            background: var(--card);
            color: var(--text);
            min-width: 220px;
            outline: none;
        }

        .btn {
            padding: 10px 16px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            font-weight: 600;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-start {
            background: linear-gradient(180deg, #7bd389, #5dbb6f);
            color: white;
        }

        .btn-stop {
            background: linear-gradient(180deg, #ff9aa2, #ff6b78);
            color: white;
        }

        .btn-esp {
            background: linear-gradient(180deg, #7fc7ff, #4a9fff);
            color: white;
        }

        .content {
            margin-top: 18px;
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 18px;
        }

        .card {
            border-radius: 14px;
            padding: 12px;
            background: var(--card);
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow);
            backdrop-filter: blur(6px);
        }

        .camera-container {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            min-height: 360px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        video#video {
            display: block;
            width: 100%;
            height: auto;
            max-height: 720px;
            background: #000;
        }

        canvas#canvas {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .output-container h3 {
            font-size: 1.05rem;
            margin-bottom: 8px;
        }

        .coordinates-output {
            background: transparent;
            color: var(--text);
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, "Courier New", monospace;
            max-height: 560px;
            overflow: auto;
            padding: 8px;
            border-radius: 10px;
        }

        .coordinates-output p {
            margin-bottom: 8px;
            color: var(--muted);
        }

        .tracking-options {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .tracking-option {
            display: flex;
            gap: 8px;
            align-items: center;
            background: rgba(255, 255, 255, 0.5);
            padding: 8px 10px;
            border-radius: 10px;
            border: 1px solid rgba(0, 0, 0, 0.04);
        }

        .tracking-option input {
            width: 16px;
            height: 16px;
        }

        .status {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            margin-top: 12px;
            color: var(--muted);
            font-size: 0.9rem;
        }

        /* 小屏适配 */
        @media (max-width: 900px) {
            .content {
                grid-template-columns: 1fr;
            }

            video#video {
                max-height: 360px;
            }
        }

        /* 小装饰：微交互 focus */
        select:focus,
        .btn:focus,
        .tracking-option input:focus {
            box-shadow: 0 6px 18px var(--focus);
            outline: none;
        }

        /* 统一的面板色块（浅马卡龙边） */
        .badge {
            font-size: 0.85rem;
            padding: 6px 10px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.55);
            border: 1px solid rgba(0, 0, 0, 0.03);
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <div class="title">
                <div class="logo"
                    style="width:44px;height:44px;border-radius:10px;background:linear-gradient(180deg,var(--accent-4),var(--accent-2));box-shadow:0 6px 14px rgba(0,0,0,0.06)">
                </div>
                <div>
                    <h1>人脸坐标检测系统 — 马卡龙样式</h1>
                    <p>支持摄像头选择、可视化边界框与坐标输出，自动适配暗色模式</p>
                </div>
            </div>

            <div class="controls-row">
                <div class="camera-selector">
                    <select id="cameraSelect">
                        <option value="">自动选择摄像头...</option>
                    </select>
                </div>

                <button id="startBtn" class="btn btn-start">开始检测</button>
                <button id="stopBtn" class="btn btn-stop" disabled>停止检测</button>
                <button id="connectBtn" class="btn btn-esp">连接 ESP32</button>

                <div style="margin-left:auto;display:flex;gap:8px;align-items:center;">
                    <div class="badge">预览分辨率：640×480</div>
                </div>
            </div>

            <div class="tracking-options">
                <label class="tracking-option"><input type="checkbox" id="trackBoundingBox" checked>
                    <span>追踪边界框</span></label>
                <label class="tracking-option"><input type="checkbox" id="trackPupils" checked>
                    <span>追踪瞳孔</span></label>
                <label class="tracking-option"><input type="checkbox" id="trackAllLandmarks"> <span>所有特征点</span></label>
            </div>

        </header>

        <div class="content">
            <div class="card camera-container">
                <video id="video" playsinline autoplay muted></video>
                <canvas id="canvas"></canvas>
            </div>

            <div class="card output-container">
                <h3>人脸坐标输出</h3>
                <div id="coordinatesOutput" class="coordinates-output">
                    <p>等待检测...</p>
                </div>
                <div class="status">
                    <span id="statusText">状态: 未就绪</span>
                    <span id="connectionStatus">ESP32: 未连接</span>
                </div>
            </div>
        </div>
    </div>

    <!-- MediaPipe -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/face_detection.js"></script>

    <script>
        class FaceDetectionApp {
            constructor() {
                // core
                this.faceDetection = null;
                this.isRunning = false;
                this.videoElement = document.getElementById('video');
                this.canvasElement = document.getElementById('canvas');
                this.canvasCtx = this.canvasElement.getContext('2d');

                // elements
                this.startBtn = document.getElementById('startBtn');
                this.stopBtn = document.getElementById('stopBtn');
                this.connectBtn = document.getElementById('connectBtn');
                this.cameraSelect = document.getElementById('cameraSelect');
                this.coordinatesOutput = document.getElementById('coordinatesOutput');
                this.statusText = document.getElementById('statusText');
                this.connectionStatus = document.getElementById('connectionStatus');

                // tracking options
                this.trackBoundingBoxCheckbox = document.getElementById('trackBoundingBox');
                this.trackPupilsCheckbox = document.getElementById('trackPupils');
                this.trackAllLandmarksCheckbox = document.getElementById('trackAllLandmarks');

                this.cameras = [];
                this.selectedCameraId = null;

                // websocket
                this.wsConnection = null;
                this.isConnected = false;

                this.lastResults = null;

                this._rafHandle = null; // animation frame id

                this._bindEvents();
                this._initFaceDetection();
                this._loadCameras();
            }

            _bindEvents() {
                this.startBtn.addEventListener('click', () => this.startDetection());
                this.stopBtn.addEventListener('click', () => this.stopDetection());
                this.connectBtn.addEventListener('click', () => this.connectToESP32());
                this.cameraSelect.addEventListener('change', (e) => {
                    this.selectedCameraId = e.target.value || null;
                    if (this.isRunning) {
                        // 立即重启以应用新摄像头
                        this.restartDetection();
                    }
                });

                this.trackBoundingBoxCheckbox.addEventListener('change', () => this._updateDetectionOptions());
                this.trackPupilsCheckbox.addEventListener('change', () => this._updateDetectionOptions());
                this.trackAllLandmarksCheckbox.addEventListener('change', () => {
                    if (this.trackAllLandmarksCheckbox.checked) {
                        this.trackPupilsCheckbox.checked = false;
                    }
                    this._updateDetectionOptions();
                });
            }

            async _loadCameras() {
                try {
                    const devices = await navigator.mediaDevices.enumerateDevices();
                    this.cameras = devices.filter(d => d.kind === 'videoinput');

                    // populate select
                    this.cameraSelect.innerHTML = '<option value="">自动选择摄像头...</option>';
                    this.cameras.forEach((cam, idx) => {
                        const opt = document.createElement('option');
                        opt.value = cam.deviceId;
                        opt.textContent = cam.label || `摄像头 ${idx + 1}`;
                        this.cameraSelect.appendChild(opt);
                    });

                    if (this.cameras.length) {
                        this.selectedCameraId = this.cameras[0].deviceId;
                        this.cameraSelect.value = this.selectedCameraId;
                    }
                } catch (err) {
                    console.warn('获取设备失败', err);
                }
            }

            async _initFaceDetection() {
                this.faceDetection = new FaceDetection({
                    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/${file}`
                });
                this.faceDetection.setOptions({ model: 'short', minDetectionConfidence: 0.5 });
                this.faceDetection.onResults((r) => this._onResults(r));
                this.statusText.textContent = '状态: 就绪';
            }

            _updateDetectionOptions() {
                if (!this.faceDetection) return;
                // 简单示例：调整置信度
                const onlyBBox = this.trackBoundingBoxCheckbox.checked && !this.trackPupilsCheckbox.checked && !this.trackAllLandmarksCheckbox.checked;
                this.faceDetection.setOptions({ minDetectionConfidence: onlyBBox ? 0.35 : 0.5 });
                // 重新绘制
                if (this.isRunning && this.lastResults) this._onResults(this.lastResults);
            }

            async startDetection() {
                if (this.isRunning) return;
                try {
                    // 获取流
                    const constraints = { video: { width: { ideal: 640 }, height: { ideal: 480 } } };
                    if (this.selectedCameraId) constraints.video.deviceId = { exact: this.selectedCameraId };

                    const stream = await navigator.mediaDevices.getUserMedia(constraints);
                    this.videoElement.srcObject = stream;
                    await new Promise((res) => this.videoElement.onloadedmetadata = res);
                    this.videoElement.play();

                    // 同步 canvas 大小
                    this.canvasElement.width = this.videoElement.videoWidth || 640;
                    this.canvasElement.height = this.videoElement.videoHeight || 480;

                    this.isRunning = true;
                    this.startBtn.disabled = true;
                    this.stopBtn.disabled = false;
                    this.statusText.textContent = '状态: 检测中...';

                    // 启动循环
                    const loop = async () => {
                        if (!this.isRunning) return;
                        try {
                            await this.faceDetection.send({ image: this.videoElement });
                        } catch (e) { console.warn('faceDetection.send error', e); }
                        this._rafHandle = requestAnimationFrame(loop);
                    };
                    this._rafHandle = requestAnimationFrame(loop);
                } catch (err) {
                    console.error('启动失败', err);
                    alert('无法打开摄像头：请检查权限或摄像头是否被占用。');
                    this.statusText.textContent = '状态: 启动失败';
                }
            }

            restartDetection() {
                this.stopDetection();
                // 小延迟确保流停止
                setTimeout(() => this.startDetection(), 300);
            }

            stopDetection() {
                this.isRunning = false;
                if (this._rafHandle) cancelAnimationFrame(this._rafHandle);

                if (this.videoElement.srcObject) {
                    this.videoElement.srcObject.getTracks().forEach(t => t.stop());
                    this.videoElement.srcObject = null;
                }

                this.startBtn.disabled = false;
                this.stopBtn.disabled = true;
                this.statusText.textContent = '状态: 已停止';
                this.canvasCtx.clearRect(0, 0, this.canvasElement.width, this.canvasElement.height);
                this.coordinatesOutput.innerHTML = '<p>检测已停止</p>';
            }

            _onResults(results) {
                this.lastResults = results;
                // 清空画布
                const ctx = this.canvasCtx;
                ctx.save();
                ctx.clearRect(0, 0, this.canvasElement.width, this.canvasElement.height);

                // 将视频帧绘制到 canvas（做为背景）
                try {
                    ctx.drawImage(results.image, 0, 0, this.canvasElement.width, this.canvasElement.height);
                } catch (e) { /* 某些浏览器可能抛出跨域错误，但通常不会 */ }

                let outHTML = '';

                if (results.detections && results.detections.length) {
                    results.detections.forEach((det, idx) => {
                        const bbox = det.boundingBox;
                        const landmarks = det.landmarks || [];

                        if (this.trackBoundingBoxCheckbox.checked && bbox) {
                            this._drawBoundingBox(bbox, idx);
                        }

                        if (this.trackAllLandmarksCheckbox.checked && landmarks.length) {
                            drawLandmarks(ctx, landmarks, { color: '#ff4444', lineWidth: 1, radius: 2 });
                        }

                        const coords = this._extractCoordinates(landmarks, bbox);

                        outHTML += `<div style="margin-bottom:10px;padding:8px;border-radius:8px;background:rgba(255,255,255,0.02)">`;
                        outHTML += `<div style="font-weight:700;margin-bottom:6px">人脸 ${idx + 1}</div>`;
                        if (this.trackBoundingBoxCheckbox.checked) {
                            outHTML += `<div>中心: (${coords.bbox.x.toFixed(1)}, ${coords.bbox.y.toFixed(1)})</div>`;
                            outHTML += `<div>尺寸: ${coords.bbox.width.toFixed(1)} × ${coords.bbox.height.toFixed(1)}</div>`;
                        }
                        if (this.trackPupilsCheckbox.checked || this.trackAllLandmarksCheckbox.checked) {
                            outHTML += `<div>右眼: (${coords.rightEye.x.toFixed(1)}, ${coords.rightEye.y.toFixed(1)})</div>`;
                            outHTML += `<div>左眼: (${coords.leftEye.x.toFixed(1)}, ${coords.leftEye.y.toFixed(1)})</div>`;
                        }
                        if (this.trackPupilsCheckbox.checked) {
                            const p = this._calculatePupilOffset(coords);
                            outHTML += `<div>瞳孔相对位置: H ${p.horizontal.toFixed(2)}, V ${p.vertical.toFixed(2)}</div>`;
                        }

                        outHTML += `</div>`;

                        // 如果已连接 ESP，发送坐标
                        if (this.isConnected) { this._sendCoordinatesToESP(coords); }
                    });
                } else {
                    outHTML = '<p>未检测到人脸</p>';
                }

                this.coordinatesOutput.innerHTML = outHTML;
                ctx.restore();
            }

            _drawBoundingBox(bbox, idx) {
                const ctx = this.canvasCtx;
                const w = this.canvasElement.width, h = this.canvasElement.height;
                const x = bbox.xCenter * w - (bbox.width * w) / 2;
                const y = bbox.yCenter * h - (bbox.height * h) / 2;
                const bw = bbox.width * w, bh = bbox.height * h;

                ctx.save();
                ctx.strokeStyle = 'rgba(30,120,90,0.95)';
                ctx.lineWidth = 3;
                ctx.setLineDash([6, 6]);
                ctx.strokeRect(x, y, bw, bh);
                ctx.setLineDash([]);

                // 四角装饰
                ctx.beginPath(); ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255,255,255,0.85)';
                // TL
                ctx.moveTo(x, y + 12); ctx.lineTo(x, y); ctx.lineTo(x + 12, y);
                // TR
                ctx.moveTo(x + bw - 12, y); ctx.lineTo(x + bw, y); ctx.lineTo(x + bw, y + 12);
                // BL
                ctx.moveTo(x, y + bh - 12); ctx.lineTo(x, y + bh); ctx.lineTo(x + 12, y + bh);
                // BR
                ctx.moveTo(x + bw - 12, y + bh); ctx.lineTo(x + bw, y + bh); ctx.lineTo(x + bw, y + bh - 12);
                ctx.stroke();
                ctx.restore();
            }

            _extractCoordinates(landmarks, bbox) {
                const w = this.canvasElement.width, h = this.canvasElement.height;
                const defaultPt = { x: 0, y: 0 };

                const mapIdx = (i) => (landmarks && landmarks[i]) ? { x: landmarks[i].x * w, y: landmarks[i].y * h } : defaultPt;
                // 注意：face_detection 返回的 landmarks 索引和 face_mesh 不同；这里尝试用通用点
                return {
                    bbox: {
                        x: bbox ? bbox.xCenter * w : 0,
                        y: bbox ? bbox.yCenter * h : 0,
                        width: bbox ? bbox.width * w : 0,
                        height: bbox ? bbox.height * h : 0
                    },
                    rightEye: mapIdx(0),
                    leftEye: mapIdx(1),
                    nose: mapIdx(2),
                    mouth: mapIdx(3),
                    rightEar: mapIdx(4),
                    leftEar: mapIdx(5)
                };
            }

            _calculatePupilOffset(coords) {
                const eyeRegionWidth = coords.bbox.width || 1;
                const eyeRegionHeight = (coords.bbox.height || 1) / 2;
                const eyeRegionLeft = coords.bbox.x - (coords.bbox.width / 2);
                const eyeRegionTop = coords.bbox.y - (coords.bbox.height / 2);

                const rightEyeX = coords.rightEye.x - eyeRegionLeft;
                const rightEyeY = coords.rightEye.y - eyeRegionTop;
                const leftEyeX = coords.leftEye.x - eyeRegionLeft;
                const leftEyeY = coords.leftEye.y - eyeRegionTop;

                const avgX = (rightEyeX + leftEyeX) / 2;
                const avgY = (rightEyeY + leftEyeY) / 2;
                return { horizontal: Math.max(0, Math.min(1, avgX / eyeRegionWidth)), vertical: Math.max(0, Math.min(1, avgY / eyeRegionHeight)) };
            }

            connectToESP32() {
                const ip = prompt('请输入 ESP32 的 IP 地址：', '192.168.1.100');
                if (!ip) return;
                if (this.wsConnection) this.wsConnection.close();
                try {
                    this.wsConnection = new WebSocket(`ws://${ip}:81`);
                    this.wsConnection.onopen = () => { this.isConnected = true; this.connectionStatus.textContent = 'ESP32: 已连接'; this.connectBtn.textContent = '断开'; this.connectBtn.classList.add('connected'); };
                    this.wsConnection.onclose = () => { this.isConnected = false; this.connectionStatus.textContent = 'ESP32: 未连接'; this.connectBtn.textContent = '连接 ESP32'; };
                    this.wsConnection.onerror = (e) => { console.warn('WS error', e); alert('连接失败，请检查 IP 与网络'); };
                } catch (e) { alert('连接异常：' + e.message); }
            }

            _sendCoordinatesToESP(coords) {
                if (this.wsConnection && this.wsConnection.readyState === WebSocket.OPEN) {
                    const data = { type: 'face_coordinates', timestamp: Date.now(), coords };
                    this.wsConnection.send(JSON.stringify(data));
                }
            }
        }

        document.addEventListener('DOMContentLoaded', () => { window.app = new FaceDetectionApp(); });
    </script>
</body>

</html>
